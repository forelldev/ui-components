<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Button Modes</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <div class="pull-switch">
      <div class="cord" id="cord">
        <div class="cord-strand" id="cordStrand"></div>
        <div class="cord-knot" id="cordKnot"></div>
      </div>
      <div class="bulb-holder">
        <div class="cap"></div>
        <div class="bulb">
          <div class="glass"></div>
          <div class="filament"></div>
          <div class="glow"></div>
        </div>
      </div>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
