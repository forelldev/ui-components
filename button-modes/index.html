<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Button Modes</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <div class="pull-switch">
      <svg class="chain" id="chain" viewBox="0 0 20 200" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
        <path id="chainPath" class="chain-path" d="M 10 0 Q 10 20 10 80" stroke-width="2.5" stroke-linecap="round" fill="none" />
        <circle id="chainBall" class="chain-ball" cx="10" cy="80" r="7" />
        <circle class="chain-ball-core" cx="10" cy="80" r="3.5" />
      </svg>
      <div class="bulb-holder">
        <div class="cap"></div>
        <div class="bulb">
          <div class="glass"></div>
          <div class="filament"></div>
          <div class="glow"></div>
        </div>
      </div>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
