<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Adjuntar archivo a gol</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ["Outfit", "ui-sans-serif", "system-ui", "sans-serif"] }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="min-h-screen bg-white font-sans text-black antialiased selection:bg-black selection:text-white">
  <main class="mx-auto w-full max-w-2xl px-4 py-10 sm:py-14">
    <header class="mb-8 text-center">
      <h1 class="text-4xl font-extrabold tracking-tight sm:text-5xl">
        Adjuntar archivo a gol
      </h1>
      <p class="mt-3 text-neutral-600">Arrástralo y suéltalo</p>
    </header>

    <div
      id="dropzone"
      class="dropzone relative isolate h-80 w-full cursor-pointer overflow-hidden rounded-3xl border-2 border-black shadow-[0_20px_50px_-25px_rgba(0,0,0,0.5)] outline-none transition sm:h-96 focus-visible:ring-4 focus-visible:ring-black/40"
      role="button"
      tabindex="0"
      aria-label="Zona de subida: arrastra un archivo dentro del arco o pulsa para elegirlo"
    >
      <div class="goal" id="goal" aria-hidden="true">
        <span class="goal__net" id="net"></span>
      </div>

      <div class="keeper" id="keeper" aria-hidden="true">
        <span class="keeper__arm keeper__arm--left"></span>
        <span class="keeper__arm keeper__arm--right"></span>
        <span class="keeper__head"></span>
        <span class="keeper__body"></span>
        <span class="keeper__leg keeper__leg--left"></span>
        <span class="keeper__leg keeper__leg--right"></span>
      </div>

      <svg class="trajectory" id="trajectory" aria-hidden="true">
        <path class="trajectory__path" id="trajPath" d="" />
        <circle class="trajectory__target" id="trajTarget" r="12" cx="-50" cy="-50" />
      </svg>

      <svg class="ball" id="ball" viewBox="0 0 64 64" aria-hidden="true">
        <circle cx="32" cy="32" r="29" fill="#ffffff" stroke="#000000" stroke-width="5" />
        <path d="M32 18 L45.3 27.7 L40.2 43.3 L23.8 43.3 L18.7 27.7 Z" fill="#000000" />
        <g stroke="#000000" stroke-width="4" stroke-linecap="round">
          <line x1="32" y1="18" x2="32" y2="5" />
          <line x1="45.3" y1="27.7" x2="55.8" y2="24.3" />
          <line x1="40.2" y1="43.3" x2="46.7" y2="52.2" />
          <line x1="23.8" y1="43.3" x2="17.3" y2="52.2" />
          <line x1="18.7" y1="27.7" x2="8.2" y2="24.3" />
        </g>
      </svg>
      <span class="flash" aria-hidden="true"></span>

      <div class="toast" id="toast" role="status" aria-live="polite">
        <div class="min-w-0">
          <p class="toast__title" id="toastTitle">¡GOL!</p>
          <p class="toast__msg" id="toastMsg">Archivo subido</p>
        </div>
      </div>

      <div class="dropzone__hint">
        <p class="hint-text" id="hint">Arrástralo y suéltalo dentro del arco!</p>
      </div>
    </div>

    <input type="file" id="fileInput" class="sr-only" multiple />

    <section class="mt-6 rounded-2xl border border-neutral-200 bg-neutral-50 p-5">
      <div class="flex items-center justify-between gap-4">
        <h2 class="font-bold">
          Goles marcados
          <span id="count" class="ml-2 rounded-full bg-black px-2 py-0.5 text-xs font-extrabold text-white">0</span>
        </h2>
        <button type="button" id="clearBtn" class="text-xs font-semibold text-neutral-500 transition hover:text-black">
          Vaciar todo
        </button>
      </div>

      <ul id="fileList" class="mt-4 space-y-2"></ul>

      <button type="button" id="confirmBtn" class="btn-confirm" hidden>Confirmar Subida</button>

      <p id="empty" class="mt-4 text-sm text-neutral-500">Todavía no has metido ningún gol. ¡Sube tu primer archivo!</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
